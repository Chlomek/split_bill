name: split_bill
description: "Split Bill - receipt scanning, expense splitting, and debt settlements."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend & Auth
  supabase_flutter: ^2.8.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing & Deep Linking
  go_router: ^14.6.2

  # Document Scanning & OCR
  cunning_document_scanner: ^2.8.0
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2

  # Environment & Networking
  flutter_dotenv: ^5.2.1
  http: ^1.2.2

  # QR Code Generation & Debt Settling
  qr_flutter: ^4.1.0

  # Export & Sharing
  csv: ^6.0.0
  share_plus: ^10.1.3
  path_provider: ^2.1.5

  # Localization & Utilities
  intl: ^0.20.1
  uuid: ^4.5.1

  # Freemium & In-App Purchases
  purchases_flutter: ^8.5.0

  # UI / Icons
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  riverpod_lint: ^2.6.2

flutter:
  uses-material-design: true
  assets:
    - .env
